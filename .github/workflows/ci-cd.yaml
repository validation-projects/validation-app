name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      canary_weight:
        description: Peso (%) do canary no primeiro passo do rollout
        type: string
        required: false
        default: '50'
      wait_time:
        description: Tempo em minutos que o canary fica pausado aguardando aprovação; ao expirar, a release é promovida automaticamente
        type: string
        required: false
        default: '30'
      stable_version:
        description: Versão estável atual (vazio = detectar pela versão servida antes do deploy)
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/canary-demo
  ARGOCD_VERSION: v2.9.7
  ARGOCD_APP: canary-demo
  ARGOCD_ROLLOUT: canary-demo
  CANARY_WEIGHT: ${{ inputs.canary_weight || '50' }}
  WAIT_TIME: ${{ inputs.wait_time || '30' }}
  SMOKE_INSECURE: ${{ vars.SMOKE_INSECURE || 'false' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          outputs: type=docker,dest=/tmp/image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  security-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: image
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          artifact-name: sbom.spdx.json

  publish-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          build-args: APP_VERSION=${{ needs.build.outputs.version }}

  update-gitops:
    needs: [build, publish-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: validation-projects/argo-gitops-repo
          token: ${{ secrets.GH_TOKEN }}
          ref: main
      - name: Instalar kustomize e yq
        run: |
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin
          curl -sSfL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - name: Atualizar imagem
        working-directory: clusters/lab/app-canary
        run: |
          kustomize edit set image canary-demo=${IMAGE}@${{ needs.publish-image.outputs.digest }}
          kustomize build . > /dev/null
      - name: Atualizar peso e pausa do canary
        working-directory: clusters/lab/app-canary
        run: |
          if ! [[ "$CANARY_WEIGHT" =~ ^[0-9]+$ ]] || (( CANARY_WEIGHT < 1 || CANARY_WEIGHT > 99 )); then
            echo "::error::canary_weight deve ser um inteiro entre 1 e 99 (recebido: '$CANARY_WEIGHT')"
            exit 1
          fi
          if ! [[ "$WAIT_TIME" =~ ^[0-9]+$ ]] || (( WAIT_TIME < 1 )); then
            echo "::error::wait_time deve ser um inteiro positivo (recebido: '$WAIT_TIME')"
            exit 1
          fi
          yq -i '.spec.strategy.canary.steps[0].setWeight = env(CANARY_WEIGHT)' rollout.yaml
          PAUSE_DURATION="${WAIT_TIME}m" yq -i '(.spec.strategy.canary.steps[] | select(has("pause")) | .pause) = {"duration": strenv(PAUSE_DURATION)}' rollout.yaml
          yq '.spec.strategy.canary.steps' rollout.yaml
          kustomize build . > /dev/null
      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "deploy canary-demo ${{ needs.build.outputs.version }} (${{ github.repository }}@${{ github.sha }})"
          git push origin HEAD:main

  deploy-with-argocd:
    name: Deploy canary
    needs: [build, update-gitops]
    runs-on: ubuntu-latest
    outputs:
      stable_version: ${{ steps.stable.outputs.version }}
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
    steps:
      - name: Identificar versão estável
        id: stable
        env:
          STABLE_VERSION_INPUT: ${{ inputs.stable_version }}
          STABLE_VERSION_VAR: ${{ vars.STABLE_VERSION }}
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          SMOKE_HOST: ${{ secrets.SMOKE_HOST }}
          SMOKE_INSECURE: ${{ env.SMOKE_INSECURE }}
        run: |
          version="$STABLE_VERSION_INPUT"
          source="input stable_version"
          if [ -z "$version" ]; then
            # Before the sync all traffic is served by the stable version.
            args=(-sS -m 5 -o /dev/null -D -)
            url="$SMOKE_URL"
            if [ -n "$SMOKE_HOST" ]; then
              # Same Host header and TLS SNI as smoke-ratio.js.
              authority=$(sed -E 's#^[a-z]+://([^/]+).*#\1#' <<<"$SMOKE_URL")
              host=${authority%:*}
              port=${authority##*:}
              if [ "$port" = "$authority" ]; then
                case "$SMOKE_URL" in https://*) port=443 ;; *) port=80 ;; esac
              fi
              url=$(sed -E "s#^([a-z]+://)[^/]+#\1$SMOKE_HOST:$port#" <<<"$SMOKE_URL")
              args+=(--connect-to "$SMOKE_HOST:$port:$host:$port")
            fi
            [ "$SMOKE_INSECURE" = true ] && args+=(-k)
            headers=$(for i in $(seq 1 20); do curl "${args[@]}" "$url" || true; done | tr -d '\r')
            seen=$(awk -F': ' 'tolower($1) == "x-app-version" { print $2 }' <<<"$headers" | sort -u)
            if [ "$(echo "$seen" | grep -c .)" = 1 ]; then
              version="$seen"
              source="versão servida antes do deploy"
            else
              echo "::warning::Não foi possível detectar uma única versão em produção (respostas: $(echo $seen))"
              echo "Status/server recebidos (sem X-App-Version a URL não aponta para o app):"
              summary=$(grep -iE '^(HTTP/|server:|location:)' <<<"$headers" | sort | uniq -c || true)
              echo "${summary:-  nenhuma resposta}"
            fi
          fi
          if [ -z "$version" ] && [ -n "$STABLE_VERSION_VAR" ]; then
            version="$STABLE_VERSION_VAR"
            source="variável STABLE_VERSION"
          fi
          if [ -z "$version" ]; then
            echo "::error::Versão estável desconhecida: informe o input stable_version"
            exit 1
          fi
          echo "Versão estável: $version ($source)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Instalar CLI de deploy
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x argocd
          sudo install -m 555 argocd /usr/local/bin/argocd
      - name: Mascarar credenciais
        run: echo "::add-mask::$ARGOCD_AUTH_TOKEN"
      - name: Sincronizar
        run: |
          argocd app get "$ARGOCD_APP" --grpc-web --refresh
          argocd app sync "$ARGOCD_APP" --grpc-web
          argocd app wait "$ARGOCD_APP" --grpc-web --sync --timeout 300
      - name: Aguardar rollout pausar em ${{ env.CANARY_WEIGHT }}%
        run: |
          for i in $(seq 1 60); do
            phase=$(argocd app get "$ARGOCD_APP" --grpc-web -o json | jq -r '.status.resources[]? | select(.kind=="Rollout") | .health.status')
            echo "Rollout (aguardando pausa em ${CANARY_WEIGHT}%): $phase"
            case "$phase" in
              Paused|Suspended) exit 0 ;;
              Degraded) echo "Rollout degradado"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timeout aguardando pausa"; exit 1
      - name: Status do Rollout
        if: always()
        env:
          STAGE: deploy canary
        run: |
          if ! app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json); then
            echo "::warning::Não foi possível obter o status do Rollout"
            exit 0
          fi
          rollout=$(jq -c '.status.resources[]? | select(.kind=="Rollout")' <<<"$app")
          echo "Recurso Rollout:"
          jq . <<<"$rollout"
          {
            echo "## Status do Rollout ($STAGE)"
            echo ""
            echo "| Nome | Sync | Health | Mensagem |"
            echo "| --- | --- | --- | --- |"
            if [ -z "$rollout" ]; then
              echo "| - | - | - | Nenhum Rollout encontrado |"
            else
              jq -r '[.name, .status, .health.status, .health.message] | map(. // "-" | tostring | gsub("\\|"; "\\|") | gsub("\n"; " ")) | "| " + join(" | ") + " |"' <<<"$rollout"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Validação canary
    needs: [build, publish-image, deploy-with-argocd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validar distribuição de tráfego
        id: ratio
        env:
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          SMOKE_HOST: ${{ secrets.SMOKE_HOST }}
          SMOKE_INSECURE: ${{ env.SMOKE_INSECURE }}
          CANARY_VERSION: ${{ needs.build.outputs.version }}
          STABLE_VERSION: ${{ needs.deploy-with-argocd.outputs.stable_version }}
          CANARY_WEIGHT: ${{ env.CANARY_WEIGHT }}
        run: node scripts/smoke-ratio.js
      - name: Resumo da validação
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          STABLE_VERSION: ${{ needs.deploy-with-argocd.outputs.stable_version }}
          RATIO_OUTCOME: ${{ steps.ratio.outcome }}
        run: |
          case "$RATIO_OUTCOME" in
            success) result="Aprovada" ;;
            failure) result="Reprovada" ;;
            *) result="Não executada ($RATIO_OUTCOME)" ;;
          esac
          {
            echo "## Validação canary"
            echo ""
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Versão | \`$VERSION\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Versão estável | \`$STABLE_VERSION\` |"
            echo "| Peso canary | ${CANARY_WEIGHT}% |"
            echo "| Validação de tráfego | $result |"
          } >> "$GITHUB_STEP_SUMMARY"

  auto-promote:
    name: Aguardar promoção
    needs: [smoke-test]
    runs-on: ubuntu-latest
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      APPROVAL_ENVIRONMENT: canary-approval
    steps:
      - name: Instalar CLI de deploy
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x argocd
          sudo install -m 555 argocd /usr/local/bin/argocd
      - name: Mascarar credenciais
        run: |
          echo "::add-mask::$ARGOCD_AUTH_TOKEN"
          echo "::add-mask::$GH_TOKEN"
      # The Rollout pause has duration WAIT_TIME: without approval the release is promoted when it expires.
      - name: Aguardar promoção por até ${{ env.WAIT_TIME }} minutos
        id: wait
        run: |
          start=$(date +%s)
          deadline=$(( start + WAIT_TIME * 60 + 600 ))
          while :; do
            health=$(argocd app get "$ARGOCD_APP" --grpc-web -o json | jq -r '.status.resources[]? | select(.kind=="Rollout") | "\(.health.status)|\(.health.message // "")"') || health="Unknown|"
            elapsed=$(( ($(date +%s) - start) / 60 ))
            echo "Rollout (${elapsed}/${WAIT_TIME} min): $health"
            case "$health" in
              Healthy\|*) result=promoted; break ;;
              Degraded\|*[Aa]bort*) result=aborted; break ;;
              Degraded\|*) result=degraded; break ;;
            esac
            if (( $(date +%s) >= deadline )); then
              result=timeout; break
            fi
            sleep 15
          done
          echo "Resultado: $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      # Resolves the pending promote job so the run does not stay waiting for approval.
      - name: Concluir aprovação pendente
        if: always() && steps.wait.outputs.result != 'aborted'
        env:
          RESULT: ${{ steps.wait.outputs.result }}
        run: |
          if [ "$RESULT" = promoted ]; then
            state=approved
            comment="Release promovida automaticamente ao fim da pausa de ${WAIT_TIME} minutos."
          else
            state=rejected
            comment="Release não promovida (${RESULT:-erro}); deploy será revertido."
          fi
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/pending_deployments" \
            --jq "[.[] | select(.environment.name == \"$APPROVAL_ENVIRONMENT\") | .environment.id]")
          if [ "$ids" = "[]" ]; then
            echo "Nenhuma aprovação pendente em $APPROVAL_ENVIRONMENT"
            exit 0
          fi
          jq -n --argjson ids "$ids" --arg state "$state" --arg comment "$comment" \
            '{environment_ids: $ids, state: $state, comment: $comment}' |
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/pending_deployments" --input - > /dev/null
          echo "Aprovação pendente em $APPROVAL_ENVIRONMENT: $state — $comment"
          echo "$comment" >> "$GITHUB_STEP_SUMMARY"
      - name: Status do Rollout
        if: always()
        env:
          STAGE: aguardando promoção
        run: |
          if ! app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json); then
            echo "::warning::Não foi possível obter o status do Rollout"
            exit 0
          fi
          rollout=$(jq -c '.status.resources[]? | select(.kind=="Rollout")' <<<"$app")
          echo "Recurso Rollout:"
          jq . <<<"$rollout"
          {
            echo "## Status do Rollout ($STAGE)"
            echo ""
            echo "| Nome | Sync | Health | Mensagem |"
            echo "| --- | --- | --- | --- |"
            if [ -z "$rollout" ]; then
              echo "| - | - | - | Nenhum Rollout encontrado |"
            else
              jq -r '[.name, .status, .health.status, .health.message] | map(. // "-" | tostring | gsub("\\|"; "\\|") | gsub("\n"; " ")) | "| " + join(" | ") + " |"' <<<"$rollout"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promover release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment: canary-approval
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
    steps:
      - name: Instalar CLI de deploy
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x argocd
          sudo install -m 555 argocd /usr/local/bin/argocd
      - name: Mascarar credenciais
        run: echo "::add-mask::$ARGOCD_AUTH_TOKEN"
      - name: Promover release
        run: |
          health=$(argocd app get "$ARGOCD_APP" --grpc-web -o json | jq -r '.status.resources[]? | select(.kind=="Rollout") | .health.status')
          if [ "$health" = Healthy ]; then
            echo "Release já promovida automaticamente ao fim da pausa"
          else
            argocd app actions run "$ARGOCD_APP" resume --kind Rollout --resource-name "$ARGOCD_ROLLOUT" --grpc-web
          fi
          argocd app wait "$ARGOCD_APP" --grpc-web --health --timeout 300
      - name: Status do Rollout
        if: always()
        env:
          STAGE: promoção
        run: |
          if ! app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json); then
            echo "::warning::Não foi possível obter o status do Rollout"
            exit 0
          fi
          rollout=$(jq -c '.status.resources[]? | select(.kind=="Rollout")' <<<"$app")
          echo "Recurso Rollout:"
          jq . <<<"$rollout"
          {
            echo "## Status do Rollout ($STAGE)"
            echo ""
            echo "| Nome | Sync | Health | Mensagem |"
            echo "| --- | --- | --- | --- |"
            if [ -z "$rollout" ]; then
              echo "| - | - | - | Nenhum Rollout encontrado |"
            else
              jq -r '[.name, .status, .health.status, .health.message] | map(. // "-" | tostring | gsub("\\|"; "\\|") | gsub("\n"; " ")) | "| " + join(" | ") + " |"' <<<"$rollout"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resumo da promoção
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## Promoção concluída"
            echo ""
            echo "Release \`$VERSION\` promovida para 100% do tráfego."
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Reverter deploy
    needs: [build, smoke-test, promote]
    if: always() && needs.smoke-test.result != 'skipped' && needs.promote.result != 'success'
    runs-on: ubuntu-latest
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
    steps:
      # !failure() keeps the steps running when the run was cancelled.
      - name: Instalar CLI de deploy
        if: ${{ !failure() }}
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x argocd
          sudo install -m 555 argocd /usr/local/bin/argocd
      - name: Mascarar credenciais
        if: ${{ !failure() }}
        run: echo "::add-mask::$ARGOCD_AUTH_TOKEN"
      - name: Reverter para versão anterior
        if: ${{ !failure() }}
        run: |
          argocd app actions run "$ARGOCD_APP" abort --kind Rollout --resource-name "$ARGOCD_ROLLOUT" --grpc-web
          # An aborted Rollout stays Degraded (RolloutAborted) with 100% of the traffic on the stable version.
          for i in $(seq 1 60); do
            health=$(argocd app get "$ARGOCD_APP" --grpc-web -o json | jq -r '.status.resources[]? | select(.kind=="Rollout") | "\(.health.status)|\(.health.message // "")"')
            echo "Rollout: $health"
            case "$health" in
              Healthy\|*|Degraded\|*[Aa]bort*) exit 0 ;;
            esac
            sleep 5
          done
          echo "Timeout aguardando a restauração da versão anterior"; exit 1
      - name: Status do Rollout
        if: always()
        env:
          STAGE: rollback
        run: |
          if ! app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json); then
            echo "::warning::Não foi possível obter o status do Rollout"
            exit 0
          fi
          rollout=$(jq -c '.status.resources[]? | select(.kind=="Rollout")' <<<"$app")
          echo "Recurso Rollout:"
          jq . <<<"$rollout"
          {
            echo "## Status do Rollout ($STAGE)"
            echo ""
            echo "| Nome | Sync | Health | Mensagem |"
            echo "| --- | --- | --- | --- |"
            if [ -z "$rollout" ]; then
              echo "| - | - | - | Nenhum Rollout encontrado |"
            else
              jq -r '[.name, .status, .health.status, .health.message] | map(. // "-" | tostring | gsub("\\|"; "\\|") | gsub("\n"; " ")) | "| " + join(" | ") + " |"' <<<"$rollout"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resumo do rollback
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          ROLLBACK_OUTCOME: ${{ job.status }}
        run: |
          if [ "$SMOKE_RESULT" != "success" ]; then
            reason="A validação de tráfego do canary falhou; a aprovação não foi solicitada."
          else
            case "$PROMOTE_RESULT" in
              cancelled) reason="A promoção foi cancelada." ;;
              failure) reason="O deploy foi rejeitado (por um revisor ou por não ter sido promovido após a pausa de ${WAIT_TIME} minutos) ou a promoção falhou." ;;
              *) reason="O deploy não foi aprovado dentro de ${WAIT_TIME} minutos, foi rejeitado ou falhou." ;;
            esac
          fi
          if [ "$ROLLBACK_OUTCOME" = "success" ]; then
            restored="A versão anterior foi restaurada e a release \`$VERSION\` foi descartada."
          else
            restored="**Falha ao restaurar a versão anterior — verificação manual necessária.**"
          fi
          {
            echo "## Deploy revertido"
            echo ""
            echo "$reason"
            echo ""
            echo "$restored"
            echo ""
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Versão | \`$VERSION\` |"
            echo "| Validação canary | ${SMOKE_RESULT} |"
            echo "| Promoção | ${PROMOTE_RESULT} |"
            echo "| Tempo de espera | ${WAIT_TIME} min |"
          } >> "$GITHUB_STEP_SUMMARY"
