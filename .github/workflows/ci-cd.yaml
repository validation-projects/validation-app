name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      canary_weight:
        description: Peso (%) do canary no primeiro passo do rollout
        type: string
        required: false
        default: '50'
      wait_time:
        description: Tempo em minutos aguardando aprovação (vazio = canary-wait-time do gha-config.yml)
        type: string
        required: false
        default: ''
      stable_version:
        description: Versão estável atual (vazio = detectar pela versão servida antes do deploy)
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/canary-demo
  ARGOCD_VERSION: v2.9.7
  ARGOCD_APP: canary-demo
  ARGOCD_ROLLOUT: canary-demo
  CANARY_WEIGHT: ${{ inputs.canary_weight || '50' }}
  SMOKE_INSECURE: ${{ vars.SMOKE_INSECURE || 'false' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  config:
    name: Load pipeline config
    runs-on: ubuntu-26.04
    outputs:
      model: ${{ steps.config.outputs.model }}
      wait-time: ${{ steps.config.outputs.wait-time }}
      status-url: ${{ steps.config.outputs.status-url }}
    steps:
      - uses: actions/checkout@v7
      - name: Instalar yq
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Ler gha-config.yml
        id: config
        env:
          CONFIG_FILE: gha-config.yml
          WAIT_TIME_INPUT: ${{ inputs.wait_time }}
        run: |
          model="" wait_time="" status_url=""
          if [ -f "$CONFIG_FILE" ]; then
            model=$(yq '.["canary-pipeline-model"] // ""' "$CONFIG_FILE")
            wait_time=$(yq '.["canary-wait-time"] // ""' "$CONFIG_FILE")
            status_url=$(yq '.["canary-status-url"] // ""' "$CONFIG_FILE")
          else
            echo "::warning::$CONFIG_FILE não encontrado; usando o modelo github-approval e 30 minutos"
          fi
          model=${model:-github-approval}
          wait_time=${WAIT_TIME_INPUT:-${wait_time:-30}}
          status_url=${status_url%/}
          case "$model" in
            github-approval | rollout-approval | rollout-link) ;;
            *)
              echo "::error file=$CONFIG_FILE::canary-pipeline-model inválido: '$model' (use github-approval, rollout-approval ou rollout-link)"
              exit 1
              ;;
          esac
          if ! [[ "$wait_time" =~ ^[0-9]+$ ]] || (( 10#$wait_time < 1 )); then
            echo "::error file=$CONFIG_FILE::canary-wait-time deve ser um inteiro positivo (recebido: '$wait_time')"
            exit 1
          fi
          wait_time=$(( 10#$wait_time ))
          if [ "$model" = rollout-link ] && ! [[ "$status_url" =~ ^https?://[^/]+ ]]; then
            echo "::error file=$CONFIG_FILE::canary-status-url deve ser uma URL http(s) no modelo rollout-link (recebido: '$status_url')"
            exit 1
          fi
          echo "Modelo da pipeline canary: $model"
          echo "Tempo de espera: ${wait_time} min${WAIT_TIME_INPUT:+ (input wait_time)}"
          {
            echo "model=$model"
            echo "wait-time=$wait_time"
            echo "status-url=$status_url"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          outputs: type=docker,dest=/tmp/image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  security-scan:
    name: Security scan
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: image
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          artifact-name: sbom.spdx.json

  publish-image:
    name: Publish image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, security-scan]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          build-args: APP_VERSION=${{ needs.build.outputs.version }}

  update-gitops:
    name: Update GitOps manifests
    needs: [config, build, publish-image]
    runs-on: ubuntu-26.04
    env:
      MODEL: ${{ needs.config.outputs.model }}
      WAIT_TIME: ${{ needs.config.outputs.wait-time }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: validation-projects/argo-gitops-repo
          token: ${{ secrets.GH_TOKEN }}
          ref: main
      - name: Instalar kustomize e yq
        run: |
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin
          curl -sSfL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - name: Atualizar imagem
        working-directory: clusters/lab/app-canary
        run: |
          kustomize edit set image canary-demo=${IMAGE}@${{ needs.publish-image.outputs.digest }}
          kustomize build . > /dev/null
      - name: Atualizar peso e pausa do canary
        working-directory: clusters/lab/app-canary
        run: |
          if ! [[ "$CANARY_WEIGHT" =~ ^[0-9]+$ ]] || (( CANARY_WEIGHT < 1 || CANARY_WEIGHT > 99 )); then
            echo "::error::canary_weight deve ser um inteiro entre 1 e 99 (recebido: '$CANARY_WEIGHT')"
            exit 1
          fi
          yq -i '.spec.strategy.canary.steps[0].setWeight = env(CANARY_WEIGHT)' rollout.yaml
          if [ "$MODEL" = github-approval ]; then
            # Paused until promote resumes it or rollback aborts it.
            yq -i '(.spec.strategy.canary.steps[] | select(has("pause")) | .pause) = {}' rollout.yaml
          else
            # The Rollout counts the wait and promotes itself when the pause expires.
            PAUSE_DURATION="${WAIT_TIME}m" yq -i '(.spec.strategy.canary.steps[] | select(has("pause")) | .pause) = {"duration": strenv(PAUSE_DURATION)}' rollout.yaml
          fi
          yq '.spec.strategy.canary.steps' rollout.yaml
          kustomize build . > /dev/null
      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "deploy canary-demo ${{ needs.build.outputs.version }} (${{ github.repository }}@${{ github.sha }})"
          git push origin HEAD:main

  deploy-with-argocd:
    name: Deploy canary
    needs: [config, build, update-gitops]
    runs-on: ubuntu-26.04
    outputs:
      stable_version: ${{ steps.stable.outputs.version }}
      app-namespace: ${{ steps.pause.outputs.app-namespace }}
      rollout-namespace: ${{ steps.pause.outputs.rollout-namespace }}
      paused-at: ${{ steps.pause.outputs.paused-at }}
      pause-duration: ${{ steps.pause.outputs.pause-duration }}
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
    steps:
      - name: Identificar versão estável
        id: stable
        env:
          STABLE_VERSION_INPUT: ${{ inputs.stable_version }}
          STABLE_VERSION_VAR: ${{ vars.STABLE_VERSION }}
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          SMOKE_HOST: ${{ secrets.SMOKE_HOST }}
          SMOKE_INSECURE: ${{ env.SMOKE_INSECURE }}
        run: |
          version="$STABLE_VERSION_INPUT"
          source="input stable_version"
          if [ -z "$version" ]; then
            # Before the sync all traffic is served by the stable version.
            args=(-sS -m 5 -o /dev/null -D -)
            url="$SMOKE_URL"
            if [ -n "$SMOKE_HOST" ]; then
              # Same Host header and TLS SNI as smoke-ratio.js.
              authority=$(sed -E 's#^[a-z]+://([^/]+).*#\1#' <<<"$SMOKE_URL")
              host=${authority%:*}
              port=${authority##*:}
              if [ "$port" = "$authority" ]; then
                case "$SMOKE_URL" in https://*) port=443 ;; *) port=80 ;; esac
              fi
              url=$(sed -E "s#^([a-z]+://)[^/]+#\1$SMOKE_HOST:$port#" <<<"$SMOKE_URL")
              args+=(--connect-to "$SMOKE_HOST:$port:$host:$port")
            fi
            [ "$SMOKE_INSECURE" = true ] && args+=(-k)
            headers=$(for i in $(seq 1 20); do curl "${args[@]}" "$url" || true; done | tr -d '\r')
            seen=$(awk -F': ' 'tolower($1) == "x-app-version" { print $2 }' <<<"$headers" | sort -u)
            if [ "$(echo "$seen" | grep -c .)" = 1 ]; then
              version="$seen"
              source="versão servida antes do deploy"
            else
              echo "::warning::Não foi possível detectar uma única versão em produção (respostas: $(echo $seen))"
              echo "Status/server recebidos (sem X-App-Version a URL não aponta para o app):"
              summary=$(grep -iE '^(HTTP/|server:|location:)' <<<"$headers" | sort | uniq -c || true)
              echo "${summary:-  nenhuma resposta}"
            fi
          fi
          if [ -z "$version" ] && [ -n "$STABLE_VERSION_VAR" ]; then
            version="$STABLE_VERSION_VAR"
            source="variável STABLE_VERSION"
          fi
          if [ -z "$version" ]; then
            echo "::error::Versão estável desconhecida: informe o input stable_version"
            exit 1
          fi
          echo "Versão estável: $version ($source)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Instalar CLI de deploy
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x argocd
          sudo install -m 555 argocd /usr/local/bin/argocd
      - name: Mascarar credenciais
        run: echo "::add-mask::$ARGOCD_AUTH_TOKEN"
      - name: Sincronizar
        run: |
          argocd app get "$ARGOCD_APP" --grpc-web --refresh
          argocd app sync "$ARGOCD_APP" --grpc-web
          argocd app wait "$ARGOCD_APP" --grpc-web --sync --timeout 300
      - name: Aguardar rollout pausar em ${{ env.CANARY_WEIGHT }}%
        run: |
          for i in $(seq 1 60); do
            phase=$(argocd app get "$ARGOCD_APP" --grpc-web -o json | jq -r '.status.resources[]? | select(.kind=="Rollout") | .health.status')
            echo "Rollout (aguardando pausa em ${CANARY_WEIGHT}%): $phase"
            case "$phase" in
              Paused|Suspended) exit 0 ;;
              Degraded) echo "Rollout degradado"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timeout aguardando pausa"; exit 1
      # Read from the live Rollout: start and duration of the pause that counts the wait.
      - name: Ler pausa do Rollout
        id: pause
        if: needs.config.outputs.model != 'github-approval'
        run: |
          app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json)
          rollout_ns=$(jq -r --arg r "$ARGOCD_ROLLOUT" '.status.resources[]? | select(.kind == "Rollout" and .name == $r) | .namespace' <<<"$app")
          echo "app-namespace=$(jq -r '.metadata.namespace // ""' <<<"$app")" >> "$GITHUB_OUTPUT"
          echo "rollout-namespace=$rollout_ns" >> "$GITHUB_OUTPUT"
          rollout_live() {
            local raw
            raw=$(curl -sSf -m 15 -G -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "https://$ARGOCD_SERVER/api/v1/applications/$ARGOCD_APP/resource" \
              --data-urlencode "namespace=$rollout_ns" --data-urlencode "resourceName=$ARGOCD_ROLLOUT" \
              -d group=argoproj.io -d version=v1alpha1 -d kind=Rollout) || return 1
            jq -c '.manifest | fromjson' <<<"$raw"
          }
          # phase|abort|pause start|pause duration|message of the current canary step.
          pause_info() {
            jq -r '(.status.currentStepIndex // 0) as $i | [
              .status.phase // "Unknown",
              (.status.abort // false | tostring),
              ([.status.pauseConditions[]? | select(.reason == "CanaryPauseStep") | .startTime][0] // ""),
              (.spec.strategy.canary.steps[$i].pause.duration // "" | tostring),
              (.status.message // "" | gsub("[|\n]"; " "))
            ] | join("|")'
          }
          if ! live=$(rollout_live); then
            echo "::warning::Não foi possível ler a pausa do Rollout"
            exit 0
          fi
          IFS='|' read -r phase _ paused_at duration message <<<"$(pause_info <<<"$live")"
          echo "Rollout $phase: pausa de ${duration:-?} iniciada em ${paused_at:-?}${message:+ ($message)}"
          echo "paused-at=$paused_at" >> "$GITHUB_OUTPUT"
          echo "pause-duration=$duration" >> "$GITHUB_OUTPUT"
      - name: Status do Rollout
        if: always()
        env:
          STAGE: deploy canary
        run: |
          if ! app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json); then
            echo "::warning::Não foi possível obter o status do Rollout"
            exit 0
          fi
          rollout=$(jq -c '.status.resources[]? | select(.kind=="Rollout")' <<<"$app")
          echo "Recurso Rollout:"
          jq . <<<"$rollout"
          {
            echo "## Status do Rollout ($STAGE)"
            echo ""
            echo "| Nome | Sync | Health | Mensagem |"
            echo "| --- | --- | --- | --- |"
            if [ -z "$rollout" ]; then
              echo "| - | - | - | Nenhum Rollout encontrado |"
            else
              jq -r '[.name, .status, .health.status, .health.message] | map(. // "-" | tostring | gsub("\\|"; "\\|") | gsub("\n"; " ")) | "| " + join(" | ") + " |"' <<<"$rollout"
            fi
          }

  smoke-test:
    name: Canary validation
    needs: [config, build, publish-image, deploy-with-argocd]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validar distribuição de tráfego
        id: ratio
        env:
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          SMOKE_HOST: ${{ secrets.SMOKE_HOST }}
          SMOKE_INSECURE: ${{ env.SMOKE_INSECURE }}
          CANARY_VERSION: ${{ needs.build.outputs.version }}
          STABLE_VERSION: ${{ needs.deploy-with-argocd.outputs.stable_version }}
          CANARY_WEIGHT: ${{ env.CANARY_WEIGHT }}
        run: node scripts/smoke-ratio.js
      - name: Resumo da validação
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          STABLE_VERSION: ${{ needs.deploy-with-argocd.outputs.stable_version }}
          RATIO_OUTCOME: ${{ steps.ratio.outcome }}
          MODEL: ${{ needs.config.outputs.model }}
          WAIT_TIME: ${{ needs.config.outputs.wait-time }}
        run: |
          {
            echo "## Release \`$VERSION\` em canary"
            echo ""
            if [ "$RATIO_OUTCOME" = failure ]; then
              echo "A validação de tráfego falhou; o deploy será revertido."
            elif [ "$RATIO_OUTCOME" != success ]; then
              echo "A validação de tráfego não foi executada."
            else
              echo "Recebendo ${CANARY_WEIGHT}% do tráfego (estável: \`$STABLE_VERSION\`)."
              case "$MODEL" in
                github-approval) echo "Aprove em **canary-approval** em até ${WAIT_TIME} min para promover; sem aprovação, o deploy é revertido." ;;
                rollout-approval) echo "Promoção automática em ${WAIT_TIME} min. Aprove em **canary-approval** para promover antes ou rejeite para reverter." ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  approval-wait:
    name: Wait for approval
    needs: [config, smoke-test]
    if: needs.config.outputs.model == 'github-approval'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    env:
      WAIT_TIME: ${{ needs.config.outputs.wait-time }}
      GH_TOKEN: ${{ github.token }}
      APPROVAL_ENVIRONMENT: canary-approval
      PROMOTE_JOB: Promote release
    steps:
      # The Rollout stays paused until promote resumes it; without approval in WAIT_TIME the run is
      # cancelled and rollback aborts the Rollout.
      - name: Aguardar aprovação por até ${{ env.WAIT_TIME }} minutos
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          start=$(date +%s)
          deadline=$(( start + WAIT_TIME * 60 ))
          seen=false
          while (( $(date +%s) < deadline )); do
            pending=$(gh api "$api/pending_deployments" \
              --jq "[.[] | select(.environment.name == \"$APPROVAL_ENVIRONMENT\")] | length")
            promote=$(gh api "$api/jobs" \
              --jq ".jobs[] | select(.name == \"$PROMOTE_JOB\") | \"\(.status) \(.conclusion // \"\")\"")
            elapsed=$(( ($(date +%s) - start) / 60 ))
            if (( pending > 0 )); then
              seen=true
              echo "Aguardando aprovação em $APPROVAL_ENVIRONMENT: ${elapsed}/${WAIT_TIME} min"
            else
              case "$promote" in
                completed\ failure) decision="rejeitado" ;;
                in_progress*|completed*) decision="aprovado" ;;
                *) $seen && decision="aprovado" || decision="" ;;
              esac
              if [ -n "$decision" ]; then
                echo "Deploy $decision após ${elapsed} min (promoção: $promote)"
                echo "Deploy $decision após ${elapsed} de ${WAIT_TIME} minutos." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Aguardando a promoção entrar em aprovação (promoção: ${promote:-desconhecido})"
            fi
            sleep 30
          done
          echo "Sem aprovação em ${WAIT_TIME} minutos; cancelando o deploy"
          echo "Deploy não aprovado em ${WAIT_TIME} minutos; o run foi cancelado e o deploy será revertido." >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "$api/cancel" > /dev/null
          # Wait for the cancellation to reach this job.
          sleep 300

  rollout-wait:
    name: Wait for promotion
    needs: [config, deploy-with-argocd, smoke-test]
    if: needs.config.outputs.model == 'rollout-approval'
    runs-on: ubuntu-26.04
    env:
      WAIT_TIME: ${{ needs.config.outputs.wait-time }}
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ROLLOUT_NAMESPACE: ${{ needs.deploy-with-argocd.outputs.rollout-namespace }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      APPROVAL_ENVIRONMENT: canary-approval
    steps:
      - name: Instalar CLI de deploy
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x argocd
          sudo install -m 555 argocd /usr/local/bin/argocd
      - name: Mascarar credenciais
        run: |
          echo "::add-mask::$ARGOCD_AUTH_TOKEN"
          echo "::add-mask::$GH_TOKEN"
      # The remaining time comes from the Rollout pause; it promotes itself when the pause expires
      # and promote resumes it earlier when canary-approval is approved.
      - name: Aguardar promoção do Rollout
        id: wait
        run: |
          rollout_ns="$ROLLOUT_NAMESPACE"
          rollout_live() {
            local raw
            raw=$(curl -sSf -m 15 -G -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "https://$ARGOCD_SERVER/api/v1/applications/$ARGOCD_APP/resource" \
              --data-urlencode "namespace=$rollout_ns" --data-urlencode "resourceName=$ARGOCD_ROLLOUT" \
              -d group=argoproj.io -d version=v1alpha1 -d kind=Rollout) || return 1
            jq -c '.manifest | fromjson' <<<"$raw"
          }
          # phase|abort|pause start|pause duration|message of the current canary step.
          pause_info() {
            jq -r '(.status.currentStepIndex // 0) as $i | [
              .status.phase // "Unknown",
              (.status.abort // false | tostring),
              ([.status.pauseConditions[]? | select(.reason == "CanaryPauseStep") | .startTime][0] // ""),
              (.spec.strategy.canary.steps[$i].pause.duration // "" | tostring),
              (.status.message // "" | gsub("[|\n]"; " "))
            ] | join("|")'
          }
          to_seconds() {
            [[ "$1" =~ ^([0-9]+)([smh]?)$ ]] || return 0
            case "${BASH_REMATCH[2]}" in
              h) echo $(( BASH_REMATCH[1] * 3600 )) ;;
              m) echo $(( BASH_REMATCH[1] * 60 )) ;;
              *) echo "${BASH_REMATCH[1]}" ;;
            esac
          }
          # Safety net in case the Rollout never leaves the pause.
          deadline=$(( $(date +%s) + (WAIT_TIME + 10) * 60 ))
          while :; do
            now=$(date +%s)
            if [ -n "$rollout_ns" ] && live=$(rollout_live); then
              IFS='|' read -r phase abort paused_at duration message <<<"$(pause_info <<<"$live")"
            else
              health=$(argocd app get "$ARGOCD_APP" --grpc-web -o json | jq -r '.status.resources[]? | select(.kind=="Rollout") | "\(.health.status)|\(.health.message // "")"') || health="Unknown|"
              phase=${health%%|*} message=${health#*|} paused_at="" duration="" abort=false
              case "$message" in *[Aa]bort*) abort=true ;; esac
            fi
            result=""
            if [ "$abort" = true ]; then
              result=aborted
            else
              case "$phase" in
                Healthy) result=promoted ;;
                Degraded) result=degraded ;;
              esac
            fi
            [ -n "$result" ] && break
            secs=$(to_seconds "$duration")
            if [ -n "$paused_at" ] && [ -n "$secs" ]; then
              remaining=$(( $(date -d "$paused_at" +%s) + secs - now ))
              if (( remaining < 0 )); then remaining=0; fi
              printf 'Rollout %s: promoção automática em %dm%02ds (pausa de %s iniciada em %s)\n' \
                "$phase" $(( remaining / 60 )) $(( remaining % 60 )) "$duration" "$paused_at"
            else
              echo "Rollout $phase${message:+: $message}"
            fi
            if (( now >= deadline )); then
              result=timeout
              break
            fi
            sleep 15
          done
          echo "Resultado: $result${message:+ ($message)}"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      # Resolves the pending promote job when the Rollout was promoted (or failed) on its own.
      - name: Concluir aprovação pendente
        if: always() && steps.wait.outputs.result != 'aborted'
        env:
          RESULT: ${{ steps.wait.outputs.result }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/pending_deployments"
          ids=$(gh api "$api" --jq "[.[] | select(.environment.name == \"$APPROVAL_ENVIRONMENT\") | .environment.id]")
          if [ "$ids" = "[]" ]; then
            if [ "$RESULT" = promoted ]; then
              comment="Release aprovada em $APPROVAL_ENVIRONMENT antes do fim da pausa de ${WAIT_TIME} minutos."
            else
              comment="Nenhuma aprovação pendente em $APPROVAL_ENVIRONMENT (resultado: ${RESULT:-erro})."
            fi
            echo "$comment"
            echo "$comment" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RESULT" = promoted ]; then
            state=approved
            comment="Release promovida automaticamente ao fim da pausa de ${WAIT_TIME} minutos."
          else
            state=rejected
            comment="Release não promovida (${RESULT:-erro}); o deploy será revertido."
          fi
          if ! jq -n --argjson ids "$ids" --arg state "$state" --arg comment "$comment" \
            '{environment_ids: $ids, state: $state, comment: $comment}' |
            gh api -X POST "$api" --input - > /dev/null; then
            echo "::error::Não foi possível registrar '$state' em $APPROVAL_ENVIRONMENT; o dono do GH_TOKEN precisa ser revisor do environment"
            exit 1
          fi
          echo "$APPROVAL_ENVIRONMENT: $state — $comment"
          echo "$comment" >> "$GITHUB_STEP_SUMMARY"
      - name: Status do Rollout
        if: always()
        env:
          STAGE: aguardando promoção
        run: |
          if ! app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json); then
            echo "::warning::Não foi possível obter o status do Rollout"
            exit 0
          fi
          rollout=$(jq -c '.status.resources[]? | select(.kind=="Rollout")' <<<"$app")
          echo "Recurso Rollout:"
          jq . <<<"$rollout"
          {
            echo "## Status do Rollout ($STAGE)"
            echo ""
            echo "| Nome | Sync | Health | Mensagem |"
            echo "| --- | --- | --- | --- |"
            if [ -z "$rollout" ]; then
              echo "| - | - | - | Nenhum Rollout encontrado |"
            else
              jq -r '[.name, .status, .health.status, .health.message] | map(. // "-" | tostring | gsub("\\|"; "\\|") | gsub("\n"; " ")) | "| " + join(" | ") + " |"' <<<"$rollout"
            fi
          }

  # No secrets in this job: values of secrets referenced by a job are masked in its logs and summary.
  rollout-link:
    name: Deployment status link
    needs: [config, build, deploy-with-argocd, smoke-test]
    if: needs.config.outputs.model == 'rollout-link'
    runs-on: ubuntu-26.04
    steps:
      - name: Gerar link do deployment
        env:
          VERSION: ${{ needs.build.outputs.version }}
          WAIT_TIME: ${{ needs.config.outputs.wait-time }}
          STATUS_URL: ${{ needs.config.outputs.status-url }}
          APP_NAMESPACE: ${{ needs.deploy-with-argocd.outputs.app-namespace }}
          ROLLOUT_NAMESPACE: ${{ needs.deploy-with-argocd.outputs.rollout-namespace }}
          PAUSED_AT: ${{ needs.deploy-with-argocd.outputs.paused-at }}
          PAUSE_DURATION: ${{ needs.deploy-with-argocd.outputs.pause-duration }}
        run: |
          if [[ "$STATUS_URL" == *"{"* ]]; then
            if [ -n "$ROLLOUT_NAMESPACE" ]; then
              url=${STATUS_URL//\{namespace\}/$ROLLOUT_NAMESPACE}
              url=${url//\{rollout\}/$ARGOCD_ROLLOUT}
            else
              url=${STATUS_URL%%\{*}
              echo "::warning::Namespace do Rollout desconhecido; o link aponta para $url"
            fi
          else
            url="$STATUS_URL/applications/${APP_NAMESPACE:+$APP_NAMESPACE/}$ARGOCD_APP"
            if [ -n "$ROLLOUT_NAMESPACE" ]; then
              node=$(jq -rn --arg n "argoproj.io/Rollout/$ROLLOUT_NAMESPACE/$ARGOCD_ROLLOUT/0" '$n | @uri')
              url="$url?resource=&node=$node"
            fi
          fi
          secs=""
          if [[ "$PAUSE_DURATION" =~ ^([0-9]+)([smh]?)$ ]]; then
            case "${BASH_REMATCH[2]}" in
              h) secs=$(( BASH_REMATCH[1] * 3600 )) ;;
              m) secs=$(( BASH_REMATCH[1] * 60 )) ;;
              *) secs=${BASH_REMATCH[1]} ;;
            esac
          fi
          if [ -n "$PAUSED_AT" ] && [ -n "$secs" ]; then
            promote_at=$(( $(date -d "$PAUSED_AT" +%s) + secs ))
            remaining=$(( (promote_at - $(date +%s)) / 60 ))
            if (( remaining < 0 )); then remaining=0; fi
            auto="em $(date -u -d "@$promote_at" '+%Y-%m-%d %H:%M:%S UTC') (faltam ~${remaining} min)"
          else
            auto="ao fim da pausa de ${WAIT_TIME} minutos"
          fi
          echo "Acompanhe e aprove o deployment: $url"
          echo "Promoção automática $auto"
          echo "::notice title=Acompanhar deployment::Release $VERSION em ${CANARY_WEIGHT}% do tráfego; promoção automática $auto. Acompanhe e aprove em $url"
          {
            echo "## Acompanhar deployment"
            echo ""
            echo "Release \`$VERSION\` com ${CANARY_WEIGHT}% do tráfego; promoção automática $auto."
            echo ""
            echo "**[Abrir no Argo Rollouts]($url)**: **Promote-Full** promove agora, **Abort** reverte."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote release
    needs: [config, build, smoke-test]
    if: needs.config.outputs.model != 'rollout-link'
    runs-on: ubuntu-26.04
    environment: canary-approval
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
    steps:
      - name: Instalar CLI de deploy
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x argocd
          sudo install -m 555 argocd /usr/local/bin/argocd
      - name: Mascarar credenciais
        run: echo "::add-mask::$ARGOCD_AUTH_TOKEN"
      - name: Promover release
        id: promote
        run: |
          health=$(argocd app get "$ARGOCD_APP" --grpc-web -o json | jq -r '.status.resources[]? | select(.kind=="Rollout") | .health.status')
          if [ "$health" = Healthy ]; then
            echo "Release já promovida pelo Rollout ao fim da pausa"
            echo "auto=true" >> "$GITHUB_OUTPUT"
          else
            argocd app actions run "$ARGOCD_APP" resume --kind Rollout --resource-name "$ARGOCD_ROLLOUT" --grpc-web
          fi
          argocd app wait "$ARGOCD_APP" --grpc-web --health --timeout 300
      - name: Status do Rollout
        if: always()
        env:
          STAGE: promoção
        run: |
          if ! app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json); then
            echo "::warning::Não foi possível obter o status do Rollout"
            exit 0
          fi
          rollout=$(jq -c '.status.resources[]? | select(.kind=="Rollout")' <<<"$app")
          echo "Recurso Rollout:"
          jq . <<<"$rollout"
          {
            echo "## Status do Rollout ($STAGE)"
            echo ""
            echo "| Nome | Sync | Health | Mensagem |"
            echo "| --- | --- | --- | --- |"
            if [ -z "$rollout" ]; then
              echo "| - | - | - | Nenhum Rollout encontrado |"
            else
              jq -r '[.name, .status, .health.status, .health.message] | map(. // "-" | tostring | gsub("\\|"; "\\|") | gsub("\n"; " ")) | "| " + join(" | ") + " |"' <<<"$rollout"
            fi
          }
      - name: Resumo da promoção
        env:
          VERSION: ${{ needs.build.outputs.version }}
          AUTO: ${{ steps.promote.outputs.auto }}
        run: |
          {
            echo "## Release \`$VERSION\` promovida"
            echo ""
            if [ "$AUTO" = true ]; then
              echo "100% do tráfego na nova versão (promoção automática ao fim da pausa)."
            else
              echo "100% do tráfego na nova versão."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Roll back deploy
    needs: [config, build, smoke-test, promote]
    # rollout-link has no promote job: only a failed canary validation rolls it back.
    if: >-
      always() && needs.smoke-test.result != 'skipped' &&
      (needs.smoke-test.result != 'success' ||
      (needs.config.outputs.model != 'rollout-link' && needs.promote.result != 'success'))
    runs-on: ubuntu-26.04
    env:
      MODEL: ${{ needs.config.outputs.model }}
      WAIT_TIME: ${{ needs.config.outputs.wait-time }}
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
    steps:
      # !failure() keeps the steps running when the run was cancelled by approval-wait.
      - name: Instalar CLI de deploy
        if: ${{ !failure() }}
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x argocd
          sudo install -m 555 argocd /usr/local/bin/argocd
      - name: Mascarar credenciais
        if: ${{ !failure() }}
        run: echo "::add-mask::$ARGOCD_AUTH_TOKEN"
      - name: Reverter para versão anterior
        if: ${{ !failure() }}
        run: |
          argocd app actions run "$ARGOCD_APP" abort --kind Rollout --resource-name "$ARGOCD_ROLLOUT" --grpc-web
          # An aborted Rollout stays Degraded (RolloutAborted) with 100% of the traffic on the stable version.
          for i in $(seq 1 60); do
            health=$(argocd app get "$ARGOCD_APP" --grpc-web -o json | jq -r '.status.resources[]? | select(.kind=="Rollout") | "\(.health.status)|\(.health.message // "")"')
            echo "Rollout: $health"
            case "$health" in
              Healthy\|*|Degraded\|*[Aa]bort*) exit 0 ;;
            esac
            sleep 5
          done
          echo "Timeout aguardando a restauração da versão anterior"; exit 1
      - name: Status do Rollout
        if: always()
        env:
          STAGE: rollback
        run: |
          if ! app=$(argocd app get "$ARGOCD_APP" --grpc-web -o json); then
            echo "::warning::Não foi possível obter o status do Rollout"
            exit 0
          fi
          rollout=$(jq -c '.status.resources[]? | select(.kind=="Rollout")' <<<"$app")
          echo "Recurso Rollout:"
          jq . <<<"$rollout"
          {
            echo "## Status do Rollout ($STAGE)"
            echo ""
            echo "| Nome | Sync | Health | Mensagem |"
            echo "| --- | --- | --- | --- |"
            if [ -z "$rollout" ]; then
              echo "| - | - | - | Nenhum Rollout encontrado |"
            else
              jq -r '[.name, .status, .health.status, .health.message] | map(. // "-" | tostring | gsub("\\|"; "\\|") | gsub("\n"; " ")) | "| " + join(" | ") + " |"' <<<"$rollout"
            fi
          }
      - name: Resumo do rollback
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          ROLLBACK_OUTCOME: ${{ job.status }}
        run: |
          if [ "$SMOKE_RESULT" != "success" ]; then
            reason="A validação de tráfego do canary falhou; a aprovação não foi solicitada."
          else
            case "$MODEL:$PROMOTE_RESULT" in
              github-approval:cancelled) reason="O deploy não foi aprovado dentro de ${WAIT_TIME} minutos ou o run foi cancelado." ;;
              github-approval:failure) reason="O deploy foi rejeitado por um revisor ou a promoção falhou." ;;
              rollout-approval:cancelled) reason="O run foi cancelado antes da promoção." ;;
              rollout-approval:failure) reason="O deploy foi rejeitado por um revisor, não foi promovido ao fim da pausa de ${WAIT_TIME} minutos ou a promoção falhou." ;;
              *) reason="O deploy não foi aprovado dentro de ${WAIT_TIME} minutos, foi rejeitado ou falhou." ;;
            esac
          fi
          if [ "$ROLLBACK_OUTCOME" = "success" ]; then
            restored="A versão anterior foi restaurada e a release \`$VERSION\` foi descartada."
          else
            restored="**Falha ao restaurar a versão anterior — verificação manual necessária.**"
          fi
          {
            echo "## Deploy revertido"
            echo ""
            echo "$reason"
            echo ""
            echo "$restored"
          } >> "$GITHUB_STEP_SUMMARY"
